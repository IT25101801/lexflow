<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${title} + ' – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-client-relations-officer :: sidebar(${active})}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar-search(${title}, null, '/client-relations-officer/clients', ${keyword})}"></div>
	
	<div class="content">
		
		<!-- Flash Messages -->
		<div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
		
		<div class="table-card">
			<div>
				<table>
					<thead>
					<tr>
						<th>User Code</th>
						<th>Email</th>
						<th>Name</th>
						<th>Date of Birth</th>
						<th>Gender</th>
						<th>NIC Number</th>
						<th>Wallet Balance</th>
						<th>Account Status</th>
						<th>Registered At</th>
						<th>Actions</th>
					</tr>
					</thead>
					<tbody>
					<tr th:if="${#lists.isEmpty(users)}">
						<td class="table-empty" colspan="10" th:text="${keyword != null and !#strings.isEmpty(keyword)} ? 'No clients match your search.' : 'No clients yet.'"></td>
					</tr>
					<tr th:each="user : ${users}">
						<td class="cell-id" th:text="${user.userCode}"></td>
						<td th:text="${user.email}"></td>
						<td th:text="${user.name}"></td>
						<td th:text="${#temporals.format(user.dateOfBirth, 'dd/MM/yyyy')}"></td>
						<td th:text="${user.gender.name()}"></td>
						<td th:text="${user.nicNumber}"></td>
						<td th:text="${#numbers.formatDecimal(user.walletBalance, 1, 'COMMA', 2, 'POINT')}"></td>
						<td><span class="badge" th:classappend="'badge-' + ${user.accountStatus}" th:text="${user.accountStatus}"></span></td>
						<td th:text="${#temporals.format(user.registeredAt, 'dd/MM/yyyy HH:mm')}"></td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/client-relations-officer/clients/{id}(id=${user.userId})}">View</a>
							<a class="action-btn action-btn-edit" th:if="${user.accountStatus.name() == 'ACTIVE'}" th:href="@{/client-relations-officer/clients/{id}(id=${user.userId})}">Edit</a>
							<form class="form-inline" method="post" th:if="${user.accountStatus.name() == 'ACTIVE'}" th:action="@{/client-relations-officer/clients/{id}/delete(id=${user.userId})}"
								  onsubmit="return confirm('Delete this client? This action cannot be undone.');">
								<button class="action-btn action-btn-delete" type="submit">Delete</button>
							</form>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	
	</div>
</div>

</body>
</html>
