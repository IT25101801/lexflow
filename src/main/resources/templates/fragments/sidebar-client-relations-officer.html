<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="sidebar" th:fragment="sidebar(active)">
	
	<!-- Brand -->
	<div class="sidebar-brand">
		<a th:href="@{/}" class="brand-name">
			<span class="brand-lex">Lex</span><span class="brand-flow">Flow</span>
		</a>
	</div>
	
	<!-- Navigation -->
	<nav class="sidebar-nav">
		<span class="nav-section-label">Overview</span>
		<a class="nav-item" th:classappend="${active == 'dashboard'} ? ' active'" th:href="@{/client-relations-officer/dashboard}">
			<i class="bi bi-grid"></i> Dashboard
		</a>
		<a class="nav-item" th:classappend="${active == 'profile'} ? ' active'" th:href="@{/client-relations-officer/profile}">
			<i class="bi bi-person"></i> My Profile
		</a>
		
		<span class="nav-section-label">Clients</span>
		<a class="nav-item" th:classappend="${active == 'register-client'} ? ' active'" th:href="@{/client-relations-officer/register-client}">
			<i class="bi bi-person-plus"></i> Register Client
		</a>
		<a class="nav-item" th:classappend="${active == 'clients'} ? ' active'" th:href="@{/client-relations-officer/clients}">
			<i class="bi bi-people"></i> Clients
		</a>
		
		<span class="nav-section-label">Consultations</span>
		<a class="nav-item" th:classappend="${active == 'consultation-new'} ? ' active'" th:href="@{/client-relations-officer/consultations/new}">
			<i class="bi bi-envelope-plus"></i> Submit Consultation
		</a>
		<a class="nav-item" th:classappend="${active == 'consultations'} ? ' active'" th:href="@{/client-relations-officer/consultations}">
			<i class="bi bi-envelope"></i> Consultations
		</a>
		
		<span class="nav-section-label">Schedule</span>
		<a class="nav-item" th:classappend="${active == 'events-upcoming'} ? ' active'" th:href="@{/client-relations-officer/events/upcoming}">
			<i class="bi bi-calendar3"></i> Upcoming Events
		</a>
		<a class="nav-item" th:classappend="${active == 'events-past'} ? ' active'" th:href="@{/client-relations-officer/events/past}">
			<i class="bi bi-calendar-check"></i> Past Events
		</a>
	</nav>
	<script>
		(function () {
			var nav = document.currentScript.previousElementSibling;
			var saved = sessionStorage.getItem("sidebarScrollTop");
			
			function restore() {
				if (saved !== null) nav.scrollTop = parseInt(saved, 10);
			}
			
			restore();
			nav.style.visibility = "visible";
			// Re-apply once everything (including the icon webfont) has
			// finished loading — a late reflow can otherwise clamp the
			// scrollTop we set above back toward zero.
			window.addEventListener("load", restore);
		})();
	</script>
	
	<!-- Sidebar Footer -->
	<div th:replace="~{fragments/common :: sidebar-footer('Client Relations Officer')}"></div>

</aside>
</body>
</html>
