<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${title} + ' – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-paralegal :: sidebar(${active})}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar(${title}, null)}"></div>
	
	<div class="content">
		<div class="table-card">
			<div>
				<table>
					<thead>
					<tr>
						<th>Subject</th>
						<th>Owner</th>
						<th>Date</th>
						<th>Start Time</th>
						<th>End Time</th>
						<th>Location</th>
						<th th:if="${active == 'events-past'}">Event Status</th>
						<th>Scheduled At</th>
						<th th:if="${active == 'events-past'}">Completed At</th>
						<th th:if="${active == 'events-past'}">Canceled At</th>
						<th>Actions</th>
					</tr>
					</thead>
					<tbody>
					<tr th:if="${#lists.isEmpty(events)}">
						<td class="table-empty" th:attr="colspan=${active == 'events-past' ? 11 : 8}" th:text="${active == 'events-past' ? 'No past events.' : 'No upcoming events.'}"></td>
					</tr>
					<tr th:each="event : ${events}">
						<td th:text="${event.subject}"></td>
						<td th:if="${event instanceof T(lexflow.entity.scheduling.ConsultationEvent)}">
							<a class="item-title" th:href="@{/paralegal/consultations/{id}(id=${event.consultation.consultationId})}" th:text="${event.consultation.consultationCode}"></a>
						</td>
						<td th:if="${event instanceof T(lexflow.entity.scheduling.CaseEvent)}">
							<a class="item-title" th:href="@{/paralegal/cases/{id}(id=${event.case_.caseId})}" th:text="${event.case_.caseCode}"></a>
						</td>
						<td th:text="${#temporals.format(event.date, 'dd/MM/yyyy')}"></td>
						<td th:text="${event.startTime}"></td>
						<td th:text="${event.endTime}"></td>
						<td th:text="${event.location}"></td>
						<td th:if="${active == 'events-past'}"><span class="badge" th:classappend="'badge-' + ${event.eventStatus}" th:text="${event.eventStatus}"></span></td>
						<td th:text="${#temporals.format(event.scheduledAt, 'dd/MM/yyyy HH:mm')}"></td>
						<td th:if="${active == 'events-past'}" th:text="${event.completedAt != null ? #temporals.format(event.completedAt, 'dd/MM/yyyy HH:mm') : '–'}"></td>
						<td th:if="${active == 'events-past'}" th:text="${event.canceledAt != null ? #temporals.format(event.canceledAt, 'dd/MM/yyyy HH:mm') : '–'}"></td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/paralegal/events/{id}(id=${event.eventId})}">View</a>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

</body>
</html>
