<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Register – LexFlow')}"></head>
<body class="public-page">
<link rel="stylesheet" th:href="@{/css/auth.css}"/>

<!-- Auth Card -->
<div class="auth-card">
	
	<div class="auth-brand">
		<a th:href="@{/}" class="brand-name">
			<span class="brand-lex">Lex</span><span class="brand-flow">Flow</span>
		</a>
	</div>
	
	<div class="auth-heading">
		<h1>Create your account</h1>
		<p>Fill in your details below to register as a LexFlow client.</p>
	</div>
	
	<!-- Flash Messages -->
	<div th:replace="~{fragments/common :: error-flash}"></div>
	
	<!-- Registration Form -->
	<form class="auth-form" th:action="@{/auth/register-client}" method="post" enctype="multipart/form-data">
		
		<div class="form-section">
			<p class="form-section-label">Login Credentials</p>
		</div>
		
		<div class="field-row">
			<div class="field">
				<label for="email">Email</label>
				<input id="email" type="email" name="email" placeholder="john.doe@email.com" required/>
			</div>
			<div class="field">
				<label for="password">Password</label>
				<input id="password" type="password" name="password" placeholder="••••••••" minlength="8" required/>
			</div>
		</div>
		
		<div class="form-section">
			<p class="form-section-label">Personal Information</p>
		</div>
		
		<div class="field">
			<label for="name">Name</label>
			<input id="name" type="text" name="name" placeholder="John Doe" minlength="2" maxlength="100" required/>
		</div>
		
		<div class="field-row">
			<div class="field">
				<label for="dateOfBirth">Date of Birth</label>
				<input id="dateOfBirth" type="date" name="dateOfBirth" required data-adult-birth-date/>
			</div>
			<div class="field">
				<label for="gender">Gender</label>
				<select id="gender" name="gender" required>
					<option value="" hidden>Select…</option>
					<option th:each="gender : ${genders}" th:value="${gender.name()}" th:text="${gender.name()}"></option>
				</select>
			</div>
		</div>
		
		<div class="field">
			<label>Addresses</label>
			<div id="addressRows">
				<div class="multi-input-row">
					<input type="text" name="addresses" placeholder="No. 123, Anywhere Street, Anywhere City" minlength="5" maxlength="800"/>
					<button type="button" onclick="this.parentElement.remove();">Remove</button>
				</div>
			</div>
			<button type="button" onclick="addMultiInputRow('addressRows','addresses','No. 123, Anywhere Street, Anywhere City')">+ Add Address</button>
		</div>
		
		<div class="field">
			<label>Phone Numbers</label>
			<div id="phoneNumberRows">
				<div class="multi-input-row">
					<input type="text" name="phoneNumbers" placeholder="0712345678"/>
					<button type="button" onclick="this.parentElement.remove();">Remove</button>
				</div>
			</div>
			<button type="button" onclick="addMultiInputRow('phoneNumberRows','phoneNumbers','0712345678')">+ Add Phone Number</button>
		</div>
		
		<div class="field">
			<label for="nicNumber">NIC Number</label>
			<input id="nicNumber" type="text" name="nicNumber" placeholder="200012345678" required/>
		</div>
		
		<div class="field">
			<label for="nicFile">NIC Document</label>
			<input id="nicFile" type="file" name="nicFile" accept=".pdf" required/>
			<span class="field-hint" th:if="${error}" style="color:var(--warning);">Please re-select your file.</span>
			<span class="field-hint">Upload a scanned copy of your National Identity Card. (PDF only)</span>
		</div>
		
		<button class="btn btn-primary btn-block" type="submit" style="margin-top:0.5rem;">Create Account</button>
	
	</form>
	
	<div class="auth-footer">
		Already have an account? <a th:href="@{/auth/login}">Sign in here</a>
	</div>

</div>

<!-- Demo Buttons -->
<div class="demo-btn-row">
	<span class="demo-btn-label">Demo</span>
	<button class="demo-btn" type="button" title="Fill Nimali Karunatilake With an Invalid NIC and Phone Number" onclick="fillClientRegisterFormB1()">B1</button>
	<button class="demo-btn" type="button" title="Fill Nimali Karunatilake (Client)" onclick="fillClientRegisterFormB2()">B2</button>
	<button class="demo-btn" type="button" title="Fill Dinusha Rathnayake Without an NIC Document" onclick="fillClientRegisterFormD1()">D1</button>
	<button class="demo-btn" type="button" title="Fill Dinusha Rathnayake (Client)" onclick="fillClientRegisterFormD2()">D2</button>
</div>

<script th:src="@{/js/demo.js}"></script>

</body>
</html>
