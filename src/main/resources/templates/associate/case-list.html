<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(${title} + ' – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-associate :: sidebar(${active})}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar(${title}, null)}"></div>
	
	<div class="content">
		<div class="table-card">
			<div>
				<table>
					<thead>
					<tr>
						<th>Case Code</th>
						<th>Consultation</th>
						<th>Client</th>
						<th>Paralegal</th>
						<th>Opened At</th>
						<th th:if="${active == 'cases-closed'}">Resolution Status</th>
						<th th:if="${active == 'cases-closed'}">Closed At</th>
						<th>Actions</th>
					</tr>
					</thead>
					<tbody>
					<tr th:if="${#lists.isEmpty(cases)}">
						<td class="table-empty" th:colspan="${active == 'cases-closed' ? 8 : 6}">No <span th:text="${#strings.toLowerCase(title)}"></span> yet.</td>
					</tr>
					<tr th:each="case : ${cases}">
						<td class="cell-id" th:text="${case.caseCode}"></td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/associate/consultations/{id}(id=${case.consultation.consultationId})}">View</a>
						</td>
						<td>
							<div th:text="${case.client.name}"></div>
							<div class="cell-sub" th:text="${case.client.userCode}"></div>
						</td>
						<td>
							<span th:if="${case.paralegal == null}">–</span>
							<div th:if="${case.paralegal != null}" th:text="${case.paralegal.name}"></div>
							<div class="cell-sub" th:if="${case.paralegal != null}" th:text="${case.paralegal.userCode}"></div>
						</td>
						<td th:text="${#temporals.format(case.openedAt, 'dd/MM/yyyy HH:mm')}"></td>
						<td th:if="${active == 'cases-closed'}"><span class="badge" th:classappend="'badge-' + ${case.caseResolutionStatus}" th:text="${case.caseResolutionStatus}"></span></td>
						<td th:if="${active == 'cases-closed'}" th:text="${case.closedAt != null ? #temporals.format(case.closedAt, 'dd/MM/yyyy HH:mm') : '–'}"></td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/associate/cases/{id}(id=${case.caseId})}">View</a>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

</body>
</html>
