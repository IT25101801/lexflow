<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Consultation Details – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-partner :: sidebar(${consultation.consultationStatus.name() == 'PENDING' ? 'consultation-pending' : 'consultations'})}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar('Consultation Details', null)}"></div>
	
	<div class="content">
		
		<!-- Flash Messages -->
		<div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
		<div th:replace="~{fragments/common :: error-flash}"></div>
		
		<div class="consult-layout">
			<div>
				
				<div class="section-card">
					<div class="avatar-header" style="padding-bottom:1rem;margin-bottom:1rem;border-bottom:1px solid var(--border);">
						<div>
							<div class="avatar-name">Consultation Details</div>
						</div>
						<div th:if="${consultation.consultationStatus.name() == 'SCHEDULED'}" style="margin-left:auto;display:flex;gap:0.5rem;">
							<th:block th:each="consultationEvent : ${consultationEvents}" th:if="${consultationEvent.eventStatus.name() == 'SCHEDULED'}">
								<a class="action-btn action-btn-view" th:href="@{/partner/events/{id}(id=${consultationEvent.eventId})}">View Meeting</a>
							</th:block>
						</div>
						<a class="action-btn action-btn-view" style="margin-left:auto;" th:if="${existingCase != null}"
						   th:href="@{/partner/cases/{id}(id=${existingCase.caseId})}">View Case</a>
					</div>
					<div class="detail-row">
						<span class="detail-label">Consultation Code</span>
						<span class="detail-value" th:text="${consultation.consultationCode}"></span>
					</div>
					<div class="detail-row">
						<span class="detail-label">Client</span>
						<span style="display:flex;flex-direction:column;align-items:flex-end;">
							<div th:text="${consultation.client.name}"></div>
							<div class="cell-sub" th:text="${consultation.client.userCode}"></div>
						</span>
					</div>
					<div class="detail-row">
						<span class="detail-label">Case Type</span>
						<span class="detail-value" th:text="${#strings.replace(consultation.caseType, '_', ' ')}"></span>
					</div>
					<div class="detail-row">
						<span class="detail-label">Opposing Parties</span>
						<div class="detail-value">
							<div th:each="opposingParty : ${consultation.opposingParties}" th:text="${opposingParty}"></div>
						</div>
					</div>
					<div class="detail-row" style="border-bottom:none;">
						<span class="detail-label">Legal Issue Details</span>
					</div>
					<div style="padding:0 0 0.75rem;font-size:0.88rem;line-height:1.7;color:var(--text);word-break:break-word;overflow-wrap:anywhere;border-bottom:1px solid var(--border);"
						 th:text="${consultation.description}"></div>
					<div class="detail-row">
						<span class="detail-label">Consultation Status</span>
						<span class="badge" th:classappend="'badge-' + ${consultation.consultationStatus}" th:text="${#strings.replace(consultation.consultationStatus, '_', ' ')}"></span>
					</div>
					<div class="detail-row">
						<span class="detail-label">Submitted At</span>
						<span class="detail-value" th:text="${#temporals.format(consultation.submittedAt, 'dd/MM/yyyy HH:mm')}"></span>
					</div>
					<div class="detail-row" th:if="${consultation.associate != null}">
						<span class="detail-label">Assigned Associate</span>
						<span style="display:flex;flex-direction:column;align-items:flex-end;">
							<div th:text="${consultation.associate.name}"></div>
							<div class="cell-sub" th:text="${consultation.associate.userCode}"></div>
						</span>
					</div>
					<div class="detail-row" th:if="${consultation.paralegal != null}">
						<span class="detail-label">Assigned Paralegal</span>
						<span style="display:flex;flex-direction:column;align-items:flex-end;">
							<div th:text="${consultation.paralegal.name}"></div>
							<div class="cell-sub" th:text="${consultation.paralegal.userCode}"></div>
						</span>
					</div>
					<div class="detail-row" th:if="${consultation.rejectionReason}">
						<span class="detail-label">Rejection Reason</span>
					</div>
					<div th:if="${consultation.rejectionReason}" style="padding:0.5rem 0 0.25rem;font-size:0.88rem;line-height:1.7;color:var(--text);word-break:break-word;overflow-wrap:anywhere;"
						 th:text="${consultation.rejectionReason}"></div>
				</div>
				
				<div class="section-card">
					<div class="section-title">Documents</div>
					<div class="item-list">
						<p class="empty-state" th:if="${#lists.isEmpty(consultationDocuments)}">No documents yet.</p>
						<div class="item-row" th:each="consultationDocument : ${consultationDocuments}">
							<div class="item-main">
								<a class="item-title" th:href="@{/partner/documents/consultation/{id}/{filename}(id=${consultationDocument.documentId},filename=${consultationDocument.storedFilename})}" th:text="${consultationDocument.originalFilename}" target="_blank"></a>
							</div>
						</div>
					</div>
				</div>
			
			</div>
			
			<div th:if="${consultation.consultationStatus.name() == 'PENDING' or consultation.consultationStatus.name() == 'SCHEDULED' or (!hasCase and consultation.associate != null and (consultation.consultationStatus.name() == 'ACCEPTED_BY_PARTNER' or consultation.consultationStatus.name() == 'ACCEPTED_BY_ASSOCIATE'))}">
				<div class="section-card" style="padding:0;overflow:hidden;">
					<div class="tabbar" role="tablist">
						<button class="tab" type="button" th:if="${consultation.consultationStatus.name() == 'PENDING'}" data-tab="accept">Accept</button>
						<button class="tab" type="button" th:if="${consultation.consultationStatus.name() == 'PENDING'}" data-tab="reject">Reject</button>
						<button class="tab" type="button" th:if="${consultation.consultationStatus.name() == 'ACCEPTED_BY_PARTNER'}" data-tab="schedule">Schedule Meeting</button>
						<button class="tab" type="button" th:if="${consultation.consultationStatus.name() == 'ACCEPTED_BY_ASSOCIATE' and !hasCase}" data-tab="opencase">Open Case</button>
						<button class="tab" type="button" th:if="${!hasCase and consultation.associate != null and (consultation.consultationStatus.name() == 'ACCEPTED_BY_PARTNER' or consultation.consultationStatus.name() == 'SCHEDULED' or consultation.consultationStatus.name() == 'ACCEPTED_BY_ASSOCIATE')}" data-tab="reassign">
							Reassign Staff
						</button>
					</div>
					<div class="tabpanel-wrap">
						<div class="tabpanel" th:if="${consultation.consultationStatus.name() == 'PENDING'}" data-tab="accept">
							<form method="post" th:action="@{/partner/consultations/{id}/accept(id=${consultation.consultationId})}" style="display:flex;flex-direction:column;gap:0.85rem;">
								<div class="field">
									<label for="associateId">Assign Associate</label>
									<select id="associateId" name="associateId" required>
										<option th:each="associate : ${associates}" th:value="${associate.userId}" th:text="${associate.name} + ' (' + ${associate.userCode} + ')'"></option>
									</select>
								</div>
								<div class="field">
									<label for="paralegalId">Assign Paralegal</label>
									<select id="paralegalId" name="paralegalId" required>
										<option th:each="paralegal : ${paralegals}" th:value="${paralegal.userId}" th:text="${paralegal.name} + ' (' + ${paralegal.userCode} + ')'"></option>
									</select>
								</div>
								<div>
									<button class="btn btn-primary btn-block" type="submit">Accept</button>
								</div>
							</form>
						</div>
						<div class="tabpanel" th:if="${consultation.consultationStatus.name() == 'PENDING'}" data-tab="reject">
							<form method="post" th:action="@{/partner/consultations/{id}/reject(id=${consultation.consultationId})}" style="display:flex;flex-direction:column;gap:0.85rem;">
								<div class="field">
									<label for="rejectionReason">Rejection Reason</label>
									<textarea id="rejectionReason" name="rejectionReason" rows="4" required></textarea>
								</div>
								<div>
									<button class="btn btn-danger btn-block" type="submit">Reject</button>
								</div>
							</form>
						</div>
						<div class="tabpanel" th:if="${consultation.consultationStatus.name() == 'ACCEPTED_BY_PARTNER'}" data-tab="schedule">
							<form method="post" th:action="@{/partner/consultations/{id}/schedule(id=${consultation.consultationId})}" style="display:flex;flex-direction:column;gap:0.85rem;">
								<div class="field">
									<label for="subject">Subject</label>
									<input id="subject" type="text" name="subject" required/>
								</div>
								<div class="field">
									<label for="date">Date</label>
									<input id="date" type="date" name="date" required data-not-past/>
								</div>
								<div class="field-row">
									<div class="field">
										<label for="startTime">Start Time</label>
										<input id="startTime" type="time" name="startTime" required/>
									</div>
									<div class="field">
										<label for="endTime">End Time</label>
										<input id="endTime" type="time" name="endTime" required/>
									</div>
								</div>
								<div class="field">
									<label for="location">Location</label>
									<input id="location" type="text" name="location" required/>
								</div>
								<div class="field">
									<label for="notes">Notes</label>
									<textarea id="notes" name="notes" rows="4"></textarea>
								</div>
								<div>
									<button class="btn btn-primary btn-block" type="submit">Schedule</button>
								</div>
							</form>
						</div>
						<div class="tabpanel" th:if="${consultation.consultationStatus.name() == 'ACCEPTED_BY_ASSOCIATE' and !hasCase}" data-tab="opencase">
							<form method="post" th:action="@{/partner/consultations/{id}/open-case(id=${consultation.consultationId})}">
								<button class="btn btn-primary btn-block" type="submit">Open Case</button>
							</form>
						</div>
						<div class="tabpanel" th:if="${!hasCase and consultation.associate != null and (consultation.consultationStatus.name() == 'ACCEPTED_BY_PARTNER' or consultation.consultationStatus.name() == 'SCHEDULED' or consultation.consultationStatus.name() == 'ACCEPTED_BY_ASSOCIATE')}" data-tab="reassign">
							<form method="post" th:action="@{/partner/consultations/{id}/reassign(id=${consultation.consultationId})}" style="display:flex;flex-direction:column;gap:0.85rem;">
								<div class="field">
									<label for="reassignAssociateId">Associate</label>
									<select id="reassignAssociateId" name="associateId" required>
										<option th:each="associate : ${associates}" th:value="${associate.userId}" th:text="${associate.name} + ' (' + ${associate.userCode} + ')'"
												th:selected="${consultation.associate != null and consultation.associate.userId == associate.userId}"></option>
									</select>
								</div>
								<div class="field">
									<label for="reassignParalegalId">Paralegal</label>
									<select id="reassignParalegalId" name="paralegalId" required>
										<option th:each="paralegal : ${paralegals}" th:value="${paralegal.userId}" th:text="${paralegal.name} + ' (' + ${paralegal.userCode} + ')'"
												th:selected="${consultation.paralegal != null and consultation.paralegal.userId == paralegal.userId}"></option>
									</select>
								</div>
								<div>
									<button class="btn btn-warning btn-block" type="submit">Reassign Staff</button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		
		</div>
	
	</div>
</div>

<div class="demo-btn-row" th:if="${consultation.consultationStatus.name() == 'ACCEPTED_BY_PARTNER'}">
	<span class="demo-btn-label">Demo</span>
	<button class="demo-btn" type="button" title="Fill Meeting With the End Before the Start" onclick="fillScheduleMeetingFormS1()">S1</button>
	<button class="demo-btn" type="button" title="Fill Meeting" onclick="fillScheduleMeetingFormS2()">S2</button>
</div>
<div class="demo-btn-row" th:if="${consultation.consultationStatus.name() == 'PENDING'}">
	<span class="demo-btn-label">Demo</span>
	<button class="demo-btn" type="button" title="Fill Rejection Reason" onclick="fillPartnerRejectionFormR()">R</button>
</div>
<script th:src="@{/js/demo.js}"></script>
</body>
</html>
