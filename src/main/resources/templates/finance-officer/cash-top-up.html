<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Cash Top-Up – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-finance-officer :: sidebar('cash-top-up')}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar('Cash Top-Up', null)}"></div>
	
	<div class="content">
		<div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
		<div th:replace="~{fragments/common :: error-flash}"></div>
		
		<div class="form-card">
			<div class="section-title">Top Up Client Wallet</div>
			<form th:action="@{/finance-officer/cash-top-up}" method="post" style="display:flex;flex-direction:column;gap:0.85rem;">
				<div class="field">
					<label for="clientCode">Client Code</label>
					<input id="clientCode" th:value="${error != null and topUpByCashRequest != null ? topUpByCashRequest.clientCode : null}" type="text" name="clientCode" placeholder="CLT-31-12345678" required/>
				</div>
				<div class="field">
					<label for="amount">Amount</label>
					<input id="amount" th:value="${error != null and topUpByCashRequest != null ? topUpByCashRequest.amount : null}" type="number" step="0.01" min="100" name="amount" placeholder="e.g. 5000" required/>
				</div>
				<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;">
					<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=1000">+ 1,000</button>
					<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=2000">+ 2,000</button>
					<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=5000">+ 5,000</button>
					<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=10000">+ 10,000</button>
					<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=20000">+ 20,000</button>
					<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=50000">+ 50,000</button>
				</div>
				<button class="btn btn-primary" type="submit">Top Up Wallet</button>
			</form>
		</div>
	</div>
</div>

<!-- Demo Button -->
<div class="demo-btn-row">
	<span class="demo-btn-label">Demo</span>
	<button class="demo-btn" type="button" title="Fill Unknown Client and Negative Amount" onclick="fillCashTopUpFormT1()">T1</button>
	<button class="demo-btn" type="button" title="Fill Default Client" onclick="fillCashTopUpFormT2()">T2</button>
</div>

<script th:src="@{/js/demo.js}"></script>

</body>
</html>
