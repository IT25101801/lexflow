<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Event Details – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-associate :: sidebar(${event.eventStatus.name() == 'SCHEDULED' ? 'events-upcoming' : 'events-past'})}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar('Event Details', null)}"></div>
	
	<div class="content">
		
		<!-- Flash Messages -->
		<div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
		<div th:replace="~{fragments/common :: error-flash}"></div>
		
		<div class="profile-layout">
			<div>
				
				<div class="section-card">
					<div class="avatar-header" style="padding-bottom:1rem;margin-bottom:1rem;border-bottom:1px solid var(--border);">
						<div>
							<div class="avatar-name">Event Details</div>
						</div>
						<div th:if="${event.eventStatus.name() == 'SCHEDULED'}" style="margin-left:auto;display:flex;gap:0.5rem;">
							<button class="action-btn action-btn-edit" type="button" onclick="document.getElementById('eventRescheduleModal').style.display='flex';">Reschedule</button>
							<form method="post" th:action="@{/associate/events/{id}/complete(id=${event.eventId})}">
								<button class="action-btn action-btn-create" type="submit">Complete</button>
							</form>
							<form method="post" th:action="@{/associate/events/{id}/cancel(id=${event.eventId})}" onsubmit="return confirm('Cancel this event? This action cannot be undone.');">
								<button class="action-btn action-btn-delete" type="submit">Cancel</button>
							</form>
						</div>
					</div>
					<div class="detail-row">
						<span class="detail-label">Subject</span>
						<span class="detail-value" th:text="${event.subject}"></span>
					</div>
					<div class="detail-row" th:if="${event instanceof T(lexflow.entity.scheduling.ConsultationEvent)}">
						<span class="detail-label">Owner</span>
						<a class="item-title" th:href="@{/associate/consultations/{id}(id=${event.consultation.consultationId})}" th:text="${event.consultation.consultationCode}"></a>
					</div>
					<div class="detail-row" th:if="${event instanceof T(lexflow.entity.scheduling.CaseEvent)}">
						<span class="detail-label">Owner</span>
						<a class="item-title" th:href="@{/associate/cases/{id}(id=${event.case_.caseId})}" th:text="${event.case_.caseCode}"></a>
					</div>
					<div class="detail-row">
						<span class="detail-label">Date</span>
						<span class="detail-value" th:text="${#temporals.format(event.date, 'dd/MM/yyyy')}"></span>
					</div>
					<div class="detail-row">
						<span class="detail-label">Start Time</span>
						<span class="detail-value" th:text="${event.startTime}"></span>
					</div>
					<div class="detail-row">
						<span class="detail-label">End Time</span>
						<span class="detail-value" th:text="${event.endTime}"></span>
					</div>
					<div class="detail-row">
						<span class="detail-label">Location</span>
						<span class="detail-value" th:text="${event.location}"></span>
					</div>
					<div class="detail-row">
						<span class="detail-label">Event Status</span>
						<span class="badge" th:classappend="'badge-' + ${event.eventStatus}" th:text="${event.eventStatus}"></span>
					</div>
					<div class="detail-row">
						<span class="detail-label">Scheduled At</span>
						<span class="detail-value" th:text="${#temporals.format(event.scheduledAt, 'dd/MM/yyyy HH:mm')}"></span>
					</div>
					<div class="detail-row" th:if="${event.completedAt != null}">
						<span class="detail-label">Completed At</span>
						<span class="detail-value" th:text="${#temporals.format(event.completedAt, 'dd/MM/yyyy HH:mm')}"></span>
					</div>
					<div class="detail-row" th:if="${event.canceledAt != null}">
						<span class="detail-label">Canceled At</span>
						<span class="detail-value" th:text="${#temporals.format(event.canceledAt, 'dd/MM/yyyy HH:mm')}"></span>
					</div>
					<div class="detail-row" style="border-bottom:none;">
						<span class="detail-label">Notes</span>
					</div>
					<div style="padding:0 0 0.75rem;font-size:0.88rem;line-height:1.7;color:var(--text);word-break:break-word;overflow-wrap:anywhere;"
						 th:text="${event.notes != null and !#strings.isEmpty(event.notes) ? event.notes : '–'}"></div>
				</div>
			
			</div>
		</div>
	
	</div>
</div>

<!-- Reschedule Event Modal -->
<div id="eventRescheduleModal" class="modal-overlay" th:if="${event.eventStatus.name() == 'SCHEDULED'}" onclick="if(event.target===this)this.style.display='none';">
	<div class="modal-dialog" style="max-width:480px;width:92%;max-height:90vh;overflow-y:auto;">
		<div class="section-title">Reschedule Event</div>
		<div class="demo-btn-corner">
			<button class="demo-btn" type="button" title="Fill New Meeting Time" onclick="fillRescheduleMeetingFormS3()">S3</button>
		</div>
		<form method="post" th:action="@{/associate/events/{id}/reschedule(id=${event.eventId})}" style="display:flex;flex-direction:column;gap:0.85rem;margin-top:1rem;">
			<div class="field">
				<label for="subject">Subject</label>
				<input id="subject" type="text" name="subject" th:value="${event.subject}" required/>
			</div>
			<div class="field">
				<label for="date">Date</label>
				<input id="date" type="date" name="date" th:value="${event.date}" required data-not-past/>
			</div>
			<div class="field-row">
				<div class="field">
					<label for="startTime">Start Time</label>
					<input id="startTime" type="time" name="startTime" th:value="${event.startTime}" required/>
				</div>
				<div class="field">
					<label for="endTime">End Time</label>
					<input id="endTime" type="time" name="endTime" th:value="${event.endTime}" required/>
				</div>
			</div>
			<div class="field">
				<label for="location">Location</label>
				<input id="location" type="text" name="location" th:value="${event.location}" required/>
			</div>
			<div class="field">
				<label for="notes">Notes</label>
				<textarea id="notes" name="notes" rows="4" th:text="${event.notes}"></textarea>
			</div>
			<div class="modal-actions">
				<button class="modal-btn-cancel" type="button" onclick="document.getElementById('eventRescheduleModal').style.display='none';">Cancel</button>
				<button class="btn btn-primary" type="submit">Reschedule</button>
			</div>
		</form>
	</div>
</div>

<script th:src="@{/js/demo.js}"></script>

<script>
	if (new URLSearchParams(window.location.search).has("reschedule")) {
		var rescheduleModal = document.getElementById("eventRescheduleModal");

		if (rescheduleModal) {
			rescheduleModal.style.display = "flex";
		}
	}
</script>

</body>
</html>
