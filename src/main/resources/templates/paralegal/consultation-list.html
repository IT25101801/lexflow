<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Consultation Requests – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-paralegal :: sidebar('consultations')}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar('Consultation Requests', null)}"></div>
	
	<div class="content">
		<div class="table-card">
			<div>
				<table>
					<thead>
					<tr>
						<th>Consultation Code</th>
						<th>Client</th>
						<th>Case Type</th>
						<th>Opposing Parties</th>
						<th>Consultation Status</th>
						<th>Submitted At</th>
						<th>Assigned Associate</th>
						<th>Actions</th>
					</tr>
					</thead>
					<tbody>
					<tr th:if="${#lists.isEmpty(consultations)}">
						<td class="table-empty" colspan="8">No consultation requests yet.</td>
					</tr>
					<tr th:each="consultation : ${consultations}">
						<td class="cell-id" th:text="${consultation.consultationCode}"></td>
						<td>
							<div th:text="${consultation.client.name}"></div>
							<div class="cell-sub" th:text="${consultation.client.userCode}"></div>
						</td>
						<td th:text="${#strings.replace(consultation.caseType, '_', ' ')}"></td>
						<td th:text="${#lists.size(consultation.opposingParties) > 1 ? consultation.opposingParties[0] + ' et al.' : consultation.opposingParties[0]}"></td>
						<td><span class="badge" th:classappend="'badge-' + ${consultation.consultationStatus}" th:text="${#strings.replace(consultation.consultationStatus, '_', ' ')}"></span></td>
						<td th:text="${#temporals.format(consultation.submittedAt, 'dd/MM/yyyy HH:mm')}"></td>
						<td>
							<span th:if="${consultation.associate == null}">–</span>
							<div th:if="${consultation.associate != null}" th:text="${consultation.associate.name}"></div>
							<div class="cell-sub" th:if="${consultation.associate != null}" th:text="${consultation.associate.userCode}"></div>
						</td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/paralegal/consultations/{id}(id=${consultation.consultationId})}">View</a>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

</body>
</html>
