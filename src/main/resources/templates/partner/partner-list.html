<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Partners – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-partner :: sidebar('users-partners')}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar-search('Partners', null, '/partner/users/partners', ${keyword})}"></div>
	
	<div class="content">
		
		<!-- Flash Messages -->
		<div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
		
		<div class="table-card">
			<div>
				<table>
					<thead>
					<tr>
						<th>User Code</th>
						<th>Email</th>
						<th>Name</th>
						<th>Date of Birth</th>
						<th>Gender</th>
						<th>NIC Number</th>
						<th>Bar Number</th>
						<th>Account Status</th>
						<th>Registered At</th>
						<th>Actions</th>
					</tr>
					</thead>
					<tbody>
					<tr th:if="${#lists.isEmpty(users)}">
						<td class="table-empty" colspan="10" th:text="${keyword != null and !#strings.isEmpty(keyword)} ? 'No partners match your search.' : 'No partners yet.'"></td>
					</tr>
					<tr th:each="u : ${users}">
						<td class="cell-id" th:text="${u.userCode}"></td>
						<td th:text="${u.email}"></td>
						<td>
							<div th:text="${u.name}"></div>
							<div class="cell-sub" th:if="${u.email == currentUserEmail}">You</div>
						</td>
						<td th:text="${#temporals.format(u.dateOfBirth, 'dd/MM/yyyy')}"></td>
						<td th:text="${u.gender.name()}"></td>
						<td th:text="${u.nicNumber}"></td>
						<td th:text="${u.barNumber}"></td>
						<td><span class="badge" th:classappend="'badge-' + ${u.accountStatus}" th:text="${u.accountStatus}"></span></td>
						<td th:text="${#temporals.format(u.registeredAt, 'dd/MM/yyyy HH:mm')}"></td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/partner/users/{id}(id=${u.userId})}">View</a>
							<a class="action-btn action-btn-edit" th:if="${u.email == currentUserEmail and u.accountStatus.name() == 'ACTIVE'}" th:href="@{/partner/users/{id}(id=${u.userId})}">Edit</a>
							<form class="form-inline" method="post" th:if="${u.email == currentUserEmail and u.accountStatus.name() == 'ACTIVE'}"
								  th:action="@{/partner/users/{id}/delete(id=${u.userId})}"
								  onsubmit="return confirm('Delete your account? This action cannot be undone. You will be logged out.');">
								<button class="action-btn action-btn-delete" type="submit">Delete</button>
							</form>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	
	</div>
</div>

</body>
</html>
