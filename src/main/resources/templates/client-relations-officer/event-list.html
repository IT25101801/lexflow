<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Consultation Events – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-client-relations-officer :: sidebar('events')}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar('Consultation Events', null)}"></div>
	
	<div class="content">
		<div class="table-card">
			<div>
				<table>
					<thead>
					<tr>
						<th>Subject</th>
						<th>Client</th>
						<th>Date</th>
						<th>Start Time</th>
						<th>End Time</th>
						<th>Location</th>
						<th>Event Status</th>
						<th>Scheduled At</th>
						<th>Completed At</th>
						<th>Canceled At</th>
						<th>Actions</th>
					</tr>
					</thead>
					<tbody>
					<tr th:if="${#lists.isEmpty(events)}">
						<td class="table-empty" colspan="11">No consultation events scheduled.</td>
					</tr>
					<tr th:each="event : ${events}">
						<td th:text="${event.subject}"></td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/client-relations-officer/consultations/{id}(id=${event.consultation.consultationId})}">View Consultation</a>
						</td>
						<td th:text="${#temporals.format(event.date, 'dd/MM/yyyy')}"></td>
						<td th:text="${event.startTime}"></td>
						<td th:text="${event.endTime}"></td>
						<td th:text="${event.location}"></td>
						<td><span class="badge" th:classappend="'badge-' + ${event.eventStatus}" th:text="${event.eventStatus}"></span></td>
						<td th:text="${#temporals.format(event.scheduledAt, 'dd/MM/yyyy HH:mm')}"></td>
						<td th:text="${event.completedAt != null ? #temporals.format(event.completedAt, 'dd/MM/yyyy HH:mm') : '–'}"></td>
						<td th:text="${event.canceledAt != null ? #temporals.format(event.canceledAt, 'dd/MM/yyyy HH:mm') : '–'}"></td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/client-relations-officer/events/{id}(id=${event.eventId})}">View</a>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

</body>
</html>
