<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8"/>
	<title th:text="${invoice.invoiceCode}">Invoice</title>
	<style>
		@page {
			size: A4;
			margin: 2cm 2.2cm 2.4cm 2.2cm;
		}
		
		body {
			font-family: "Helvetica", "Arial", sans-serif;
			color: #1c2330;
			font-size: 10pt;
			line-height: 1.5;
		}
		
		table {
			width: 100%;
			border-collapse: collapse;
		}
		
		td, th {
			vertical-align: top;
			padding: 0;
		}
		
		.letterhead td {
			padding-bottom: 14px;
		}
		
		.wordmark {
			font-size: 26pt;
			font-weight: bold;
			letter-spacing: -0.6px;
			line-height: 1;
		}
		
		.wordmark .lex {
			color: #0a1526;
		}
		
		.wordmark .flow {
			color: #d4af37;
		}
		
		.tagline {
			font-size: 8.5pt;
			letter-spacing: 1.6px;
			text-transform: uppercase;
			color: #6b7380;
			margin-top: 6px;
		}
		
		.document-title {
			text-align: right;
			font-size: 20pt;
			font-weight: bold;
			letter-spacing: 3px;
			color: #0a1526;
			line-height: 1;
		}
		
		.document-code {
			text-align: right;
			font-size: 10pt;
			color: #4a5260;
			margin-top: 8px;
		}
		
		.status {
			text-align: right;
			margin-top: 8px;
		}
		
		.status span {
			font-size: 8pt;
			font-weight: bold;
			letter-spacing: 1.2px;
			padding: 3px 10px;
			border: 1.2px solid;
		}
		
		.status-unpaid {
			color: #a16207;
			border-color: #a16207;
		}
		
		.status-paid {
			color: #15803d;
			border-color: #15803d;
		}
		
		.status-voided {
			color: #6b7380;
			border-color: #6b7380;
		}

		.status-refunded {
			color: #b91c1c;
			border-color: #b91c1c;
		}
		
		.rule {
			border-top: 2px solid #d4af37;
			margin: 4px 0 26px 0;
		}
		
		.label {
			font-size: 7.5pt;
			letter-spacing: 1.4px;
			text-transform: uppercase;
			color: #6b7380;
			padding-bottom: 5px;
		}
		
		.party-name {
			font-size: 12pt;
			font-weight: bold;
			color: #0a1526;
		}
		
		.party-detail {
			color: #4a5260;
		}
		
		.right {
			text-align: right;
		}
		
		.details td {
			padding-top: 2px;
		}
		
		.details .detail-label {
			color: #6b7380;
			padding-right: 12px;
		}
		
		.charges {
			margin-top: 30px;
		}
		
		.charges th {
			font-size: 7.5pt;
			letter-spacing: 1.4px;
			text-transform: uppercase;
			color: #6b7380;
			text-align: left;
			font-weight: normal;
			padding: 0 8px 8px 8px;
			border-bottom: 1.5px solid #0a1526;
		}
		
		.charges td {
			padding: 10px 8px;
			border-bottom: 1px solid #e3e6eb;
		}
		
		.charges .number {
			width: 28px;
			color: #6b7380;
		}
		
		.charges .amount {
			text-align: right;
			white-space: nowrap;
			width: 120px;
		}
		
		.charges .empty {
			color: #6b7380;
			font-style: italic;
		}
		
		.total {
			width: 270px;
			margin: 18px 0 0 auto;
		}
		
		.total td {
			padding: 12px 8px;
			border-top: 2px solid #0a1526;
			border-bottom: 2px solid #0a1526;
		}
		
		.total .total-label {
			font-size: 9pt;
			letter-spacing: 1.4px;
			text-transform: uppercase;
			color: #0a1526;
		}
		
		.total .total-value {
			text-align: right;
			font-size: 14pt;
			font-weight: bold;
			color: #0a1526;
		}
		
		.footer {
			margin-top: 56px;
			padding-top: 12px;
			border-top: 1px solid #e3e6eb;
			font-size: 8pt;
			color: #6b7380;
			text-align: center;
		}
	</style>
</head>
<body>

<table class="letterhead">
	<tr>
		<td>
			<div class="wordmark"><span class="lex">Lex</span><span class="flow">Flow</span></div>
			<div class="tagline">Case Management</div>
		</td>
		<td>
			<div class="document-title">INVOICE</div>
			<div class="document-code" th:text="${invoice.invoiceCode}"></div>
			<div class="status" th:with="refunded=${invoice.invoiceStatus.name() == 'VOIDED' and invoice.paidAt != null}"><span th:class="${refunded ? 'status-refunded' : 'status-' + #strings.toLowerCase(invoice.invoiceStatus.name())}" th:text="${refunded ? 'REFUNDED' : invoice.invoiceStatus.name()}"></span></div>
		</td>
	</tr>
</table>

<div class="rule"></div>

<table>
	<tr>
		<td style="width:50%;">
			<div class="label">Billed To</div>
			<div class="party-name" th:text="${case.client.name}"></div>
			<div class="party-detail" th:text="${case.client.email}"></div>
			<div class="party-detail" th:text="${case.client.userCode}"></div>
		</td>
		<td class="right" style="width:50%;">
			<div class="label">Case</div>
			<div class="party-name" th:text="${case.caseCode}"></div>
			<table class="details" style="width:auto;margin-left:auto;">
				<tr>
					<td class="detail-label">Associate</td>
					<td class="right" th:text="${case.associate.name}"></td>
				</tr>
				<tr>
					<td class="detail-label">Compiled</td>
					<td class="right" th:text="${#temporals.format(invoice.compiledAt, 'dd MMM yyyy')}"></td>
				</tr>
				<tr th:if="${invoice.paidAt != null}">
					<td class="detail-label">Paid</td>
					<td class="right" th:text="${#temporals.format(invoice.paidAt, 'dd MMM yyyy')}"></td>
				</tr>
			</table>
		</td>
	</tr>
</table>

<table class="charges">
	<thead>
	<tr>
		<th class="number">#</th>
		<th>Charge</th>
		<th class="amount" style="text-align:right;">Amount</th>
	</tr>
	</thead>
	<tbody>
	<tr th:each="task, taskStatus : ${tasks}">
		<td class="number" th:text="${taskStatus.count}"></td>
		<td th:text="${task.title}"></td>
		<td class="amount" th:text="${#numbers.formatDecimal(task.billableAmount, 1, 'COMMA', 2, 'POINT')}"></td>
	</tr>
	<tr th:if="${#lists.isEmpty(tasks)}">
		<td class="number"></td>
		<td class="empty" colspan="2">The charges on this invoice were released when it was voided.</td>
	</tr>
	</tbody>
</table>

<table class="total">
	<tr>
		<td class="total-label">Total</td>
		<td class="total-value" th:text="${#numbers.formatDecimal(invoice.totalAmount, 1, 'COMMA', 2, 'POINT')}"></td>
	</tr>
</table>

<div class="footer">
	This invoice was generated by LexFlow. For questions about it, please contact your assigned associate.
</div>

</body>
</html>
