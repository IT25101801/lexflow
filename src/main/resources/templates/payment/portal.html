<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Payment Portal – LexBank')}"></head>
<body class="public-page">
<link rel="stylesheet" th:href="@{/css/payment.css}"/>

<!-- Portal Card -->
<div class="portal-card">
	
	<!-- Portal Title -->
	<div class="portal-title">Lex<span>Bank</span> – Payment Portal</div>
	
	<!-- Amount Badge -->
	<div class="amount-badge">
		<span>Amount:</span>
		<span th:text="${#numbers.formatDecimal(amount, 1, 'COMMA', 2, 'POINT')}"></span>
	</div>
	
	<!-- Flash Messages -->
	<div th:replace="~{fragments/common :: error-flash}"></div>
	
	<!-- Card Visual -->
	<div class="card-visual-wrap">
		<div class="card-visual">
			<div class="card-row-1">
				<div class="card-logo">Lex<span>Bank</span></div>
			</div>
			<div class="card-row-2">
				<div class="card-chip"></div>
				<i class="bi bi-wifi card-nfc"></i>
			</div>
			<div class="card-middle" id="card-preview">•••• •••• •••• ••••</div>
			<div class="card-bottom">
				<div>
					<div class="card-field-label">Cardholder</div>
					<div class="card-holder-preview" id="holder-preview">CARDHOLDER NAME</div>
				</div>
				<div>
					<div class="card-field-label">Valid Thru</div>
					<div class="card-expiry-preview" id="expiry-preview">MM/YY</div>
				</div>
			</div>
		</div>
	</div>
	
	<!-- Payment Form -->
	<form method="post" th:action="@{/payment/process}" style="display:flex;flex-direction:column;gap:1rem;">
		<input type="hidden" name="amount" th:value="${amount}"/>
		<div class="field">
			<label for="cardNumber">Card Number</label>
			<input id="cardNumberDisplay" type="text" placeholder="1234 5678 9012 3456" maxlength="19"
				   autocomplete="cc-number" oninput="formatCardNumber(this); updateCardNumber();" required/>
			<input id="cardNumber" type="hidden" name="cardNumber"/>
		</div>
		<div class="field">
			<label for="cardholder">Cardholder Name</label>
			<input id="cardholder" type="text" name="cardholder" placeholder="Name on the card"
				   autocomplete="cc-name" oninput="updateCardholder()" required/>
		</div>
		<div class="field-row">
			<div class="field">
				<label for="expiry">Expiry (MM/YY)</label>
				<input id="expiry" type="text" name="expiry" placeholder="MM/YY" maxlength="5"
					   autocomplete="cc-exp" oninput="formatExpiry(this)" required/>
			</div>
			<div class="field">
				<label for="cvv">CVV</label>
				<input id="cvv" type="password" name="cvv" placeholder="•••" maxlength="3"
					   autocomplete="cc-csc" required/>
			</div>
		</div>
		<button class="btn-pay" type="submit">
			<i class="bi bi-credit-card"></i>
			Pay <span th:text="${#numbers.formatDecimal(amount, 1, 'COMMA', 2, 'POINT')}"></span>
		</button>
	</form>

</div>

<!-- Demo Buttons -->
<div class="demo-btn-row">
	<span class="demo-btn-label">Demo</span>
	<button class="demo-btn" type="button" title="Fill Test Card With an Invalid Number and Expiry" onclick="fillPaymentFormT1()">T1</button>
	<button class="demo-btn" type="button" title="Fill Test Card" onclick="fillPaymentFormT2()">T2</button>
</div>

<script th:src="@{/js/demo.js}"></script>

<!-- Format Card -->
<script>
	function formatCardNumber(input) {
		var digits = input.value.replace(/\D/g, "").substring(0, 16);
		input.value = digits.replace(/(.{4})/g, "$1 ").trim();
		document.getElementById("cardNumber").value = digits;
	}
	
	function formatExpiry(input) {
		var digits = input.value.replace(/\D/g, "").substring(0, 4);
		if (digits.length >= 2) {
			digits = digits.substring(0, 2) + "/" + digits.substring(2);
		}
		input.value = digits;
		updateExpiry();
	}
	
	function updateCardNumber() {
		var cardNumber = document.getElementById("cardNumberDisplay").value || "";
		document.getElementById("card-preview").textContent = cardNumber.padEnd(19, "•").substring(0, 19);
	}
	
	function updateCardholder() {
		var cardholder = document.getElementById("cardholder").value || "CARDHOLDER NAME";
		document.getElementById("holder-preview").textContent = cardholder.toUpperCase().substring(0, 26);
	}
	
	function updateExpiry() {
		var expiry = document.getElementById("expiry").value;
		document.getElementById("expiry-preview").textContent = expiry || "MM/YY";
	}
</script>

</body>
</html>
