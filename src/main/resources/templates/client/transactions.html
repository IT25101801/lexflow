<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Wallet &amp; Transactions – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-client :: sidebar('transactions')}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar('Wallet &amp; Transactions', null)}"></div>
	
	<div class="content">
		<div class="flash flash-success" th:if="${success}" th:text="${success}"></div>
		<div class="flash flash-error" th:if="${error}" th:text="${error}"></div>
		
		<!-- Wallet Header -->
		<div class="wallet-top">
			<div class="wallet-balance-card">
				<div class="section-title">Available Balance</div>
				<div class="balance-amount">
					<span th:text="${#numbers.formatDecimal(client.walletBalance, 1, 'COMMA', 2, 'POINT')}"></span>
				</div>
			</div>
			<div class="form-card topup-card">
				<div class="section-title">Top Up Your Wallet</div>
				<form th:action="@{/client/transactions/top-up}" method="post" style="display:flex;flex-direction:column;gap:1rem;">
					<div class="field">
						<label for="amount">Amount</label>
						<input id="amount" type="number" step="0.01" min="100" name="amount" placeholder="e.g. 5000" required/>
					</div>
					<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:0.6rem;">
						<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=1000">+ 1,000</button>
						<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=2000">+ 2,000</button>
						<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=5000">+ 5,000</button>
						<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=10000">+ 10,000</button>
						<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=20000">+ 20,000</button>
						<button class="btn btn-sm btn-outline" type="button" onclick="document.getElementById('amount').value=50000">+ 50,000</button>
					</div>
					<button class="btn btn-primary" type="submit">Top Up Now</button>
				</form>
			</div>
		</div>
		
		<!-- Transaction History -->
		<div class="table-card">
			<div id="txTableWrap">
				<table>
					<thead>
					<tr>
						<th>Transaction Code</th>
						<th>Amount</th>
						<th>Transaction Type</th>
						<th>Invoice ID</th>
						<th>Occurred At</th>
					</tr>
					</thead>
					<tbody>
					<tr th:if="${#lists.isEmpty(transactions)}">
						<td class="table-empty" colspan="5">No transactions yet.</td>
					</tr>
					<tr th:each="transaction : ${transactions}">
						<td class="cell-id" th:text="${transaction.transactionCode}"></td>
						<td th:text="${#numbers.formatDecimal(transaction.amount, 1, 'COMMA', 2, 'POINT')}"></td>
						<td><span th:classappend="'tx-' + ${transaction.transactionType.name()}" th:text="${#strings.replace(transaction.transactionType, '_', ' ')}"></span></td>
						<td class="cell-id" th:text="${transaction.invoiceId ?: '–'}"></td>
						<td th:text="${#temporals.format(transaction.occurredAt, 'dd/MM/yyyy HH:mm')}"></td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

<!-- Fit table to remaining viewport height below the wallet header -->
<script>
	(function () {
		var el = document.getElementById("txTableWrap");
		
		function fit() {
			el.style.maxHeight = (window.innerHeight - el.getBoundingClientRect().top - 32) + "px";
		}
		
		fit();
		window.addEventListener("resize", fit);
	})();
</script>

</body>
</html>
