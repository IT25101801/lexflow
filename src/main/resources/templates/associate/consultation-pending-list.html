<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Pending Consultation Requests – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-associate :: sidebar('consultation-pending')}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar('Pending Consultation Requests', null)}"></div>
	
	<div class="content">
		<div class="table-card">
			<div>
				<table>
					<thead>
					<tr>
						<th>Consultation Code</th>
						<th>Client</th>
						<th>Case Type</th>
						<th>Opposing Parties</th>
						<th>Submitted At</th>
						<th>Actions</th>
					</tr>
					</thead>
					<tbody>
					<tr th:if="${#lists.isEmpty(consultations)}">
						<td class="table-empty" colspan="6">No pending consultation requests.</td>
					</tr>
					<tr th:each="r : ${consultations}">
						<td class="cell-id" th:text="${r.consultationCode}"></td>
						<td>
							<div th:text="${r.client.name}"></div>
							<div class="cell-sub" th:text="${r.client.userCode}"></div>
						</td>
						<td th:text="${#strings.replace(r.caseType, '_', ' ')}"></td>
						<td th:text="${#lists.size(r.opposingParties) > 1 ? r.opposingParties[0] + ' et al.' : r.opposingParties[0]}"></td>
						<td th:text="${#temporals.format(r.submittedAt, 'dd/MM/yyyy HH:mm')}"></td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/associate/consultations/{id}(id=${r.consultationId})}">View</a>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

</body>
</html>
