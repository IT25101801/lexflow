<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head('Unscheduled Consultations – LexFlow')}"></head>
<body>

<aside th:replace="~{fragments/sidebar-associate :: sidebar('consultation-pending')}"></aside>

<div class="main">
	<div th:replace="~{fragments/common :: topbar('Unscheduled Consultations', null)}"></div>
	
	<div class="content">
		<div class="table-card">
			<div>
				<table>
					<thead>
					<tr>
						<th>Consultation Code</th>
						<th>Client</th>
						<th>Case Type</th>
						<th>Opposing Parties</th>
						<th>Requested At</th>
						<th>Actions</th>
					</tr>
					</thead>
					<tbody>
					<tr th:if="${#lists.isEmpty(consultations)}">
						<td class="table-empty" colspan="6">No unscheduled consultations.</td>
					</tr>
					<tr th:each="consultation : ${consultations}">
						<td class="cell-id" th:text="${consultation.consultationCode}"></td>
						<td>
							<div th:text="${consultation.client.name}"></div>
							<div class="cell-sub" th:text="${consultation.client.userCode}"></div>
						</td>
						<td th:text="${#strings.replace(consultation.caseType, '_', ' ')}"></td>
						<td th:text="${#lists.size(consultation.opposingParties) > 1 ? consultation.opposingParties[0] + ' et al.' : consultation.opposingParties[0]}"></td>
						<td th:text="${#temporals.format(consultation.requestedAt, 'dd/MM/yyyy HH:mm')}"></td>
						<td>
							<a class="action-btn action-btn-view" th:href="@{/associate/consultations/{id}(id=${consultation.consultationId})}">View</a>
						</td>
					</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
</div>

</body>
</html>
